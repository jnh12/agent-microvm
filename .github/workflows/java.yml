name: Java SDK
on:
  workflow_dispatch:
  pull_request:
    paths: ['sdk/io/**', 'tests/java/**', 'gradle/**', 'gradlew*', '*.gradle', 'docs/java.md', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
  push:
    branches: [main, develop]
    paths: ['sdk/io/**', 'tests/java/**', 'gradle/**', 'gradlew*', '*.gradle', 'docs/java.md', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test build sdkDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: vmnest-java
          retention-days: 30
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/distributions/*.zip
