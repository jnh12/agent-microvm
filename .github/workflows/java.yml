name: Java SDK
on:
  pull_request:
    paths: ['java/**', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
  push:
    branches: [main, develop]
    paths: ['java/**', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test build publish
        working-directory: java
