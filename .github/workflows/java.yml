name: Java SDK
on:
  workflow_dispatch:
  pull_request:
    paths: ['sdk/java/**', 'LICENSE', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
  push:
    branches: [main, develop]
    paths: ['sdk/java/**', 'LICENSE', 'guest/**', 'sdk/agent_sandbox_mcp/tools/**', '.github/workflows/java.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test build sdkDistribution
      - run: bash gradlew -p tests/consumer compileJava
      - uses: actions/upload-artifact@v4
        with:
          name: vmnest-java
          retention-days: 30
          if-no-files-found: error
          path: |
            sdk/java/build/libs/*.jar
            sdk/java/build/distributions/*.zip
