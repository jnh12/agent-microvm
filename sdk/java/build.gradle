plugins { id 'java-library'; id 'maven-publish' }
group = 'io.github.jnh12'
version = providers.gradleProperty('sdkVersion').getOrElse('0.1.0-SNAPSHOT')
repositories { mavenCentral() }
java { withSourcesJar(); withJavadocJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
dependencies {
 api 'software.amazon.awssdk:lambdamicrovms:2.57.8'
 api 'software.amazon.awssdk:cloudwatch:2.57.8'
 api 'software.amazon.awssdk:cloudwatchlogs:2.57.8'
 api 'software.amazon.awssdk:s3:2.57.8'
 api 'software.amazon.awssdk:iam:2.57.8'
 api 'software.amazon.awssdk:lambdacore:2.57.8'
 api 'software.amazon.awssdk:ec2:2.57.8'
 implementation 'software.amazon.awssdk:url-connection-client:2.57.8'
 api 'com.fasterxml.jackson.core:jackson-databind:2.19.4'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); testLogging { exceptionFormat = 'full'; showStandardStreams = true } }
publishing {
 publications { mavenJava(MavenPublication) { from components.java } }
 repositories { maven { name = 'verification'; url = layout.buildDirectory.dir('repository') } }
}
tasks.register('bundleGuest', Zip) {
 from('../../guest') { exclude '**/__pycache__/**', '**/*.pyc' }
 archiveFileName = 'vmnest-guest.zip'
 destinationDirectory = layout.buildDirectory.dir('generated-guest')
}
tasks.named('processResources') { dependsOn 'bundleGuest'; from(tasks.named('bundleGuest')); from('../../LICENSE') { into 'META-INF' } }

tasks.register('sdkDistribution', Zip) {
    dependsOn 'publishMavenJavaPublicationToVerificationRepository'
    archiveBaseName = 'vmnest-java'
    archiveClassifier = 'maven-repository'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('repository')) { into 'repository' }
    from('README.md')
    from('../../LICENSE')
}
