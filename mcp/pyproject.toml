[project]
name = "agent-sandbox-mcp"
version = "0.1.0"
description = "MCP server (FastMCP) that gives AI agents isolated microVM sandboxes on AWS Lambda MicroVMs, via the agent_sandbox SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2",
    "agent-sandbox-os>=0.1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agent-sandbox-mcp = "agent_sandbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
