[project]
name = "agent-sandbox-os"
version = "0.1.0"
description = "Embeddable Python SDK + CLI for isolated microVM sandboxes on AWS Lambda MicroVMs (a Python fork of microsandbox concepts)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The infra provisioner uses boto3 (a core dependency) directly; only the
# setup.yaml parser is extra.
infra = [
    "pyyaml>=6.0",
    # Optional ISA-L accelerated DEFLATE for faster guest-image zipping.
    # The zip helper degrades to stdlib zlib when this is absent.
    "isal>=1.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyyaml>=6.0",
    "isal>=1.6",
]

[project.scripts]
asb = "agent_sandbox.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/agent_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls in argument defaults (Argument/Option).
"sdk/agent_sandbox/cli/*.py" = ["B008"]
