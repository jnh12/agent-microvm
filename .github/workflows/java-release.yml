name: Release Java SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, without SNAPSHOT)'
        required: true
        type: string
      publish:
        description: 'Publish to Central after validation (false uploads for manual publication)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: java-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDK_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: bash
        run: '[[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,mcp]"
        working-directory: .
      - run: python tests/python_contract.py
      - run: bash gradlew --no-daemon test build sdkDistribution -PsdkVersion="$SDK_VERSION"
      - run: python tests/python_contract.py --check-java
      - run: bash gradlew --no-daemon -p tests/consumer compileJava -PsdkVersion="$SDK_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: vmnest-java-${{ inputs.version }}
          if-no-files-found: error
          path: |
            sdk/java/build/libs/*.jar
            sdk/java/build/distributions/*.zip
      - name: Sign and upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          RELEASE_AUTOMATICALLY: ${{ inputs.publish }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          task=publishToMavenCentral
          if [[ "$RELEASE_AUTOMATICALLY" == true ]]; then
            task=publishAndReleaseToMavenCentral
          fi
          bash gradlew --no-daemon "$task" -PcentralRelease=true -PsdkVersion="$SDK_VERSION"
